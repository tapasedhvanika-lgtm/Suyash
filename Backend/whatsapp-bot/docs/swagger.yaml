openapi: 3.0.0
info:
  title: WhatsApp Product Bot API
  version: 1.0.0
  description: Admin Authentication Module, Product CRUD, and WhatsApp webhook endpoints.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Admin:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        profileImage: { type: string }
        status: { type: string, enum: [Active, Inactive] }
        lastLogin: { type: string, format: date-time }
    Product:
      type: object
      properties:
        itemName: { type: string }
        description: { type: string }
        itemCode: { type: string }
        mrp: { type: number }
        bestPrice: { type: number }
        weight: { type: string }
        benefits: { type: string }
        image: { type: string }
        category: { type: string }
        stock: { type: number }
        active: { type: boolean }
paths:
  /admin/login:
    post:
      summary: Admin login
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
  /admin/logout:
    post:
      summary: Admin logout
      tags: [Admin Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Logout successful }
  /admin/refresh-token:
    post:
      summary: Exchange a refresh token for a new access/refresh token pair
      tags: [Admin Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Token refreshed }
        '401': { description: Invalid or expired refresh token }
  /admin/forgot-password:
    post:
      summary: Request a password reset email
      tags: [Admin Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200': { description: Reset link sent if the email exists }
  /admin/reset-password:
    post:
      summary: Reset password using the emailed token
      tags: [Admin Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        '200': { description: Password reset successfully }
        '400': { description: Invalid or expired token }
  /admin/change-password:
    post:
      summary: Change password while logged in
      tags: [Admin Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password changed successfully }
        '401': { description: Current password incorrect }
  /admin/profile:
    get:
      summary: Get logged-in admin profile
      tags: [Admin Profile]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
    put:
      summary: Update logged-in admin profile
      tags: [Admin Profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                phone: { type: string }
                profileImage: { type: string, format: binary }
      responses:
        '200': { description: Profile updated }
  /admin/products:
    get:
      summary: List products
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200': { description: Product list }
    post:
      summary: Create a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201': { description: Product created }
  /admin/products/{id}:
    get:
      summary: Get a product by ID
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product fetched }
        '404': { description: Not found }
    put:
      summary: Update a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200': { description: Product updated }
    delete:
      summary: Delete a product
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product deleted }
  /whatsapp/webhook:
    get:
      summary: Meta webhook verification (subscribe challenge)
      tags: [WhatsApp]
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        '200': { description: Challenge echoed back }
        '403': { description: Verify token mismatch }
    post:
      summary: Receive inbound WhatsApp messages and status updates
      tags: [WhatsApp]
      responses:
        '200': { description: Always 200 to acknowledge receipt }
